name: confidants
description: "Offline-first AI personal profiler and knowledge base."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^4.0.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  flutter_contacts: ^1.1.9+2
  shared_preferences: ^2.5.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
